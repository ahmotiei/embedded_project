# Smart Guard broker configuration for the physical computer.
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd-smart-guard
acl_file /etc/mosquitto/acl-smart-guard


log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true

# The project uses authenticated MQTT over the private host/VM network.
# For deployment on an untrusted network, add a TLS listener and certificates.
